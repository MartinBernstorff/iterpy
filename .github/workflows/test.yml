name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # setuptools_scm resolves the version from tags, which a shallow clone lacks

      - name: Build CI container
        run: |
          make docker_ci
