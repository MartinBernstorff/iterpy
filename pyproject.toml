[project]
dynamic = ["version"]
requires-python = ">=3.9"
name = "iterpy"
description = "iterpy"
dependencies = []
authors = [{ name = "Martin Bernstorff", email = "martinbernstorff@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.license]
file = "LICENSE"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[dependency-groups]
dev = [
  "cruft==2.15.0",
  "lumberman",
  "pyright==1.1.363",
  "pytest==8.2.1",
  "pytest-xdist==3.6.1",
  "pytest-sugar==1.0.0",
  "pytest-codspeed",
  "ruff==0.4.4",
  "ty>=0.0.3",
  "mypy>=1.19.1",
  "pyrefly>=0.47.0",
]

[project.urls]
homepage = "https://github.com/MartinBernstorff/iterpy"
repository = "https://github.com/MartinBernstorff/iterpy"
documentation = "https://MartinBernstorff.github.io/iterpy/"

[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["py.typed", "*.pyi"]

# Load-bearing despite being empty: it is what makes project.dynamic = ["version"] resolve.
[tool.setuptools_scm]

[tool.semantic_release]
branch = "main"
# PSR builds before it tags, so setuptools_scm would derive a dev version; pin it to the release
# instead, and refuse to publish if the artifact still came out at some other version.
build_command = "python -m pip install build && SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ITERPY=$NEW_VERSION python -m build && test -f dist/iterpy-$NEW_VERSION-py3-none-any.whl"
